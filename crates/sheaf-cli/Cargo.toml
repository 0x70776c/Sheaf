[package]
name = "sheaf-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Command-line interface for Sheaf PDF toolkit"

[[bin]]
name = "sheaf"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
ctrlc = "3.5.2"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sheaf-core = { path = "../sheaf-core" }

[dev-dependencies]
assert_cmd = "2.2.2"
insta = { version = "1.49.0", features = ["json", "redactions"] }
lopdf = "0.46.0"
predicates = "3.1.4"
tempfile = "3.27.0"

[[test]]
name = "version_sync_test"
path = "../../tests/version_sync_test.rs"
