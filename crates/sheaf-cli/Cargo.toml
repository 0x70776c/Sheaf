[package]
name = "sheaf-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Command-line interface for Sheaf PDF toolkit"

[[bin]]
name = "sheaf"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
sheaf-core = { path = "../sheaf-core" }

[dev-dependencies]
lopdf = "0.46.0"
tempfile = "3.27.0"
