  <path d="M924.0,512.0 L924.0,601.2 L923.8,629.7 L923.6,650.4 L923.4,667.2 L923.0,681.7 L922.6,694.5 L922.1,706.0 L921.5,716.5 L920.8,726.3 L920.1,735.4 L919.2,743.9 L918.3,751.9 L917.3,759.5 L916.3,766.8 L915.1,773.7 L913.9,780.2 L912.6,786.5 L911.2,792.6 L909.7,798.4 L908.1,803.9 L906.4,809.3 L904.7,814.5 L902.9,819.4 L901.0,824.2 L899.0,828.9 L896.9,833.4 L894.7,837.7 L892.4,841.9 L890.0,845.9 L887.6,849.8 L885.0,853.6 L882.3,857.2 L879.6,860.8 L876.7,864.2 L873.7,867.5 L870.7,870.7 L867.5,873.7 L864.2,876.7 L860.8,879.6 L857.2,882.3 L853.6,885.0 L849.8,887.6 L845.9,890.0 L841.9,892.4 L837.7,894.7 L833.4,896.9 L828.9,899.0 L824.2,901.0 L819.4,902.9 L814.5,904.7 L809.3,906.4 L803.9,908.1 L798.4,909.7 L792.6,911.2 L786.5,912.6 L780.2,913.9 L773.7,915.1 L766.8,916.3 L759.5,917.3 L751.9,918.3 L743.9,919.2 L735.4,920.1 L726.3,920.8 L716.5,921.5 L706.0,922.1 L694.5,922.6 L681.7,923.0 L667.2,923.4 L650.4,923.6 L629.7,923.8 L601.2,924.0 L512.0,924.0 L422.8,924.0 L394.3,923.8 L373.6,923.6 L356.8,923.4 L342.3,923.0 L329.5,922.6 L318.0,922.1 L307.5,921.5 L297.7,920.8 L288.6,920.1 L280.1,919.2 L272.1,918.3 L264.5,917.3 L257.2,916.3 L250.3,915.1 L243.8,913.9 L237.5,912.6 L231.4,911.2 L225.6,909.7 L220.1,908.1 L214.7,906.4 L209.5,904.7 L204.6,902.9 L199.8,901.0 L195.1,899.0 L190.6,896.9 L186.3,894.7 L182.1,892.4 L178.1,890.0 L174.2,887.6 L170.4,885.0 L166.8,882.3 L163.2,879.6 L159.8,876.7 L156.5,873.7 L153.3,870.7 L150.3,867.5 L147.3,864.2 L144.4,860.8 L141.7,857.2 L139.0,853.6 L136.4,849.8 L134.0,845.9 L131.6,841.9 L129.3,837.7 L127.1,833.4 L125.0,828.9 L123.0,824.2 L121.1,819.4 L119.3,814.5 L117.6,809.3 L115.9,803.9 L114.3,798.4 L112.8,792.6 L111.4,786.5 L110.1,780.2 L108.9,773.7 L107.7,766.8 L106.7,759.5 L105.7,751.9 L104.8,743.9 L103.9,735.4 L103.2,726.3 L102.5,716.5 L101.9,706.0 L101.4,694.5 L101.0,681.7 L100.6,667.2 L100.4,650.4 L100.2,629.7 L100.0,601.2 L100.0,512.0 L100.0,422.8 L100.2,394.3 L100.4,373.6 L100.6,356.8 L101.0,342.3 L101.4,329.5 L101.9,318.0 L102.5,307.5 