<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Sheaf</title>
  <defs>
    <!-- Squircle base gradients -->
    <linearGradient id="tileBg" x1="0" y1="120" x2="0" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#F4F6FB"/>
      <stop offset="100%" stop-color="#E2E6F0"/>
    </linearGradient>
    <linearGradient id="tileRim" x1="0" y1="120" x2="0" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#CAD3E2" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Document 1 (Back - Dark Navy Slate) -->
    <linearGradient id="docBack" x1="0" y1="240" x2="0" y2="700" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#242A3E"/>
      <stop offset="100%" stop-color="#141724"/>
    </linearGradient>

    <!-- Document 2 (Middle - Translucent Slate Glass) -->
    <linearGradient id="docMid" x1="0" y1="275" x2="0" y2="735" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4B5675" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#22283A" stop-opacity="0.88"/>
    </linearGradient>

    <!-- Document 3 (Front - Frosted Ice Liquid Glass) -->
    <linearGradient id="docFront" x1="0" y1="310" x2="0" y2="770" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#D6E0F2" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#9BAECB" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="glassRim" x1="0" y1="310" x2="0" y2="770" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Sheaf Binder Clamp -->
    <linearGradient id="clampBody" x1="0" y1="472" x2="0" y2="528" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#56607C"/>
      <stop offset="25%" stop-color="#343C53"/>
      <stop offset="70%" stop-color="#222737"/>
      <stop offset="100%" stop-color="#191D2A"/>
    </linearGradient>
    <linearGradient id="clampHighlight" x1="0" y1="472" x2="0" y2="476" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A4B0CC" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#56607C" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Filters & Shadows -->
    <filter id="tileDropShadow" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#0F1422" flood-opacity="0.22"/>
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F1422" flood-opacity="0.12"/>
    </filter>
    <filter id="docShadow" x="-20%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0B0E18" flood-opacity="0.28"/>
    </filter>
    <filter id="clampShadow" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

