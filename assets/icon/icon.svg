  <!-- 2. Document 1 (Back Layer - Dark Slate Navy) -->
  <g filter="url(#docShadow)">
    <rect x="316" y="244" width="316" height="452" rx="22" fill="url(#docBack)" />
    <rect x="316" y="244" width="316" height="452" rx="22" fill="none" stroke="#3D4663" stroke-width="1.5" stroke-opacity="0.6"/>
  </g>

  <!-- 3. Document 2 (Middle Layer - Frosted Translucent Slate) -->
  <g filter="url(#docShadow)">
    <rect x="352" y="276" width="316" height="452" rx="22" fill="url(#docMid)" />
    <rect x="352" y="276" width="316" height="452" rx="22" fill="none" stroke="#68779E" stroke-width="1.5" stroke-opacity="0.5"/>
  </g>

  <!-- 4. Document 3 (Front Layer - Frosted Ice Liquid Glass) -->
  <g filter="url(#docShadow)">
    <rect x="388" y="308" width="316" height="452" rx="22" fill="url(#docFront)" />
    <rect x="388" y="308" width="316" height="452" rx="22" fill="none" stroke="url(#glassRim)" stroke-width="2"/>
  </g>

  <!-- 5. Sheaf Metallic Binder Clamp (horizontal band binding the stack) -->
  <g filter="url(#clampShadow)">
    <!-- Main clamp bar with rounded caps -->
    <rect x="298" y="472" width="428" height="56" rx="14" fill="url(#clampBody)"/>
    <!-- Top reflection / bevel highlight -->
    <rect x="300" y="473" width="424" height="3" rx="1.5" fill="url(#clampHighlight)"/>
    <!-- Outer rim line -->
    <rect x="298" y="472" width="428" height="56" rx="14" fill="none" stroke="#636E8D" stroke-width="1.2" stroke-opacity="0.75"/>
  </g>
</svg>
