name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, Clippy & Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install qpdf for PDF validation
        run: brew install qpdf
      - name: Download PDFium binary for macOS
        run: |
          mkdir -p vendor/pdfium
          curl -sL "https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-mac-arm64.tgz" | tar -xzf - -C vendor/pdfium
      - name: Setup Node & Build Desktop Frontend
        working-directory: apps/desktop
        run: |
          npm ci
          npm run check
          npm run build
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --workspace
