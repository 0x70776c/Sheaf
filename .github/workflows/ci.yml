name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Lint & License Check
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Check code formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Check licenses and banned network dependencies
        run: cargo deny check licenses bans

  test-rust:
    name: Rust Tests & Smoke Tests
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7
      - name: Install qpdf
        run: brew install qpdf
      - name: Setup Universal PDFium
        run: |
          mkdir -p vendor/pdfium
          curl -sSL "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium/8111/pdfium-mac-arm64.tgz" | tar -xz -C vendor/pdfium
      - name: Run all workspace tests
        run: cargo test --workspace
      - name: Build CLI release for 500-page smoke run
        run: cargo build --release -p sheaf-cli
      - name: 500-page PDF smoke test (info)
        run: /usr/bin/time -l ./target/release/sheaf info tests/fixtures/fixture_500p.pdf
      - name: 500-page PDF smoke test (split)
        run: /usr/bin/time -l ./target/release/sheaf split tests/fixtures/fixture_500p.pdf --every 50 -o /tmp/smoke_split --force
      - name: 500-page PDF smoke test (render)
        run: /usr/bin/time -l ./target/release/sheaf render tests/fixtures/fixture_500p.pdf --pages 1-20 -o /tmp/smoke_render --force

  test-desktop:
    name: Desktop Frontend Build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install dependencies & build
        working-directory: apps/desktop
        run: |
          npm ci
          npm run check
          npm run build

  verify-docs:
    name: Documentation Sync Check
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7
      - name: Docs Sync Test
        run: cargo test --test docs_sync_test
