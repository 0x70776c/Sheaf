[package]
name = "sheaf-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Tauri 2 desktop application for Sheaf"

[lib]
name = "sheaf_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
sheaf-core = { path = "../../../crates/sheaf-core" }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = "2.12.5"
tauri-plugin-dialog = "2.8.3"
base64 = "0.23.1"

[build-dependencies]
tauri-build = "2.7.4"

[dev-dependencies]
tempfile = "3.27.0"
